agentNetwork: 2.0.0
info:
  label: "Demo Omni Agent Network"
  version: 2.0.1
  description: |
    Demo Omni Agent Network (2.0). Coordinates the order support agent, the MCP
    tools and the LLM for the TechWave Electronics support demo.
  tags:
    - demo
    - omni
    - agent-network

registry:
  agents:
    demoSupportAgent:
      info:
        label: Order Support Agent
        description: Agente A2A de suporte de pedidos da TechWave Electronics (demo-support-agent).
      metadata:
        # `Other` e o valor para agente A2A. Gemini/OpenAI/AzureOpenai sao valores
        # de plataforma de LLM (registry.llms) e nao descrevem um agente — este
        # aqui e uma app Mule com A2A Connector.
        platform: Other
        # Chave "a2a" = A2A protocol 1.x (A2A Connector 2.0). Para um agente ainda
        # em protocol 0.3.0 use a chave "a2a_v03" em vez de "a2a" (ver
        # https://docs.MuleSoft.com/agent-network/latest/af-agent-network-yaml-reference).
        interfaces:
          a2a:
            card:
              name: Order Support Agent
              description: Consulta status de pedidos e pagamentos, abre cases, processa reembolsos e notifica o time.
              version: 1.0.0
              capabilities:
                streaming: false
                pushNotifications: false
                extendedAgentCard: false
              defaultInputModes:
                - application/json
                - text/plain
              defaultOutputModes:
                - application/json
                - text/plain
              # supportedInterfaces substitui os antigos campos "url"/"protocolVersion"
              # de nível raiz do agent card (A2A protocol 1.0). Deve bater exatamente
              # com o <a2a:interface protocol="JSONRPC" path="/rpc"/> configurado no
              # demo-support-agent (global-config.xml) — daí o sufixo /rpc na URL.
              supportedInterfaces:
                - url: ${demoSupportAgent.url}/rpc
                  protocolBinding: JSONRPC
                  protocolVersion: "1.0"
                  tenant: ""
              skills:
                - id: order-support
                  name: Order Support
                  description: Responde perguntas sobre pedidos, abre cases de suporte e processa reembolsos.
                  tags:
                    - orders
                    - support
                    - refund
                  inputModes:
                    - application/json
                    - text/plain
                  outputModes:
                    - application/json
                    - text/plain

  mcps:
    mcpServer:
      info:
        label: TechWave Support MCP Server
        description: MCP server com as tools de suporte (pedido, case, reembolso, notificação).
      metadata:
        transport:
          kind: streamableHttp
          path: /mcp

  llms:
    azureOpenAi:
      info:
        label: Azure OpenAI LLM Provider
        description: Azure OpenAI provider for the broker's orchestration nodes.
      metadata:
        # Valores válidos de platform: Gemini, OpenAI, AzureOpenai
        platform: AzureOpenai
        models:
          # Mesmo deployment usado pelo demo-support-agent (endpoint /responses).
          - gpt-5.4-mini

context:
  connections:
    demoSupportAgentConnection:
      kind: a2a
      ref:
        name: demoSupportAgent
      url: ${demoSupportAgent.url}
      # Contrato "broker-to-agent": techwave-order-support-agent tem Client ID
      # Enforcement. Headers default client_id/client_secret.
      # NOTA (Agent Network 2.0): "url" fica direto na connection, sem aninhar em "spec".
      # NOTA (schema 2.0): em `apikey-client-credentials`, clientId/clientSecret sao
      # OBJETOS `{value, name}` — nao strings. `name` e o nome do header enviado
      # (default do Client ID Enforcement: client_id / client_secret).
      authentication:
        kind: apikey-client-credentials
        clientId:
          value: ${demoSupportAgent.clientId}
          name: client_id
        clientSecret:
          value: ${demoSupportAgent.clientSecret}
          name: client_secret
    mcpServerConnection:
      kind: mcp
      ref:
        name: mcpServer
      url: ${mcpServer.url}
      # Contrato "broker-to-mcp-server": techwave-support-mcp-server tem Client ID
      # Enforcement + MCP Global Access.
      authentication:
        kind: apikey-client-credentials
        clientId:
          value: ${mcpServer.clientId}
          name: client_id
        clientSecret:
          value: ${mcpServer.clientSecret}
          name: client_secret
    azureOpenAiConnection:
      kind: llm
      ref:
        name: azureOpenAi
      # Base URL do recurso Azure OpenAI, terminando em /openai/v1 — o broker monta
      # o path /responses sozinho. Forma documentada:
      #   https://<RESOURCE>.openai.azure.com/openai/v1
      # Recursos criados via AI Foundry usam o host <RESOURCE>.services.ai.azure.com
      # (é o mesmo endpoint que o demo-support-agent já usa e valida).
      url: ${azureOpenAi.url}
      authentication:
        kind: apiKey
        apiKey: ${azureOpenAi.apiKey}

brokers:
  demo-omni-broker:
    kind: AgentScript
    implementation: ./brokers/demo-omni-broker.agent
    interfaces:
      a2a:
        card:
          name: Demo Omni Broker
          description: Coordena o agente de suporte, as tools MCP e o LLM da demo TechWave Electronics.
          version: 1.0.0
          capabilities:
            streaming: false
            pushNotifications: true
            extendedAgentCard: false
          # NOTA: o card do BROKER não declara url/supportedInterfaces. Pela spec A2A 1.0
          # esses campos são obrigatórios num card, mas cards de broker são a exceção
          # prática: o broker É o endpoint e serve a si mesmo — a URL é atribuída no
          # deploy. Cards de agentes EXTERNOS (registry.agents) declaram, sim.
          defaultInputModes:
            - application/json
            - text/plain
          defaultOutputModes:
            - application/json
            - text/plain
          skills:
            - id: demo-omni-assistant
              name: Demo Omni Assistant
              description: Responde perguntas sobre pedidos e resolve solicitações de suporte, delegando ao agente quando a tarefa exige múltiplos passos.
              tags:
                - demo
                - omni
                - assistant
              examples:
                - Qual o status do pedido TW-1001?
                - O monitor do pedido TW-1002 chegou com defeito. Quero reembolso. Abra um chamado por favor.
              inputModes:
                - application/json
                - text/plain
              outputModes:
                - application/json
                - text/plain